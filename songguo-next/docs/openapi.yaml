  responses:
    Unauthorized:
      description: Missing, expired or revoked token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
    Forbidden:
      description: >
        Account, client context, staff context or permission rejected.
        Member-link review may also return code MEMBER_LINK_SELF_REVIEW_FORBIDDEN
        when the staff Account matches the requesting member Account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
    NotFound:
      description: Resource absent or hidden by tenant/site scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
    Conflict:
      description: Staff context selection or optimistic version conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
    ValidationError:
      $ref: "#/components/responses/ValidationFailed"
    Gone:
      description: Signed token or time-limited resource expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorPayload" }
    ServiceUnavailable:
      description: WeChat app is not configured or provider is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorPayload"
  schemas:
    RequestId:
      type: string
      nullable: true
    ErrorPayload:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable code. Member-link examples include
            MEMBER_LINK_CANDIDATE_BUSY, MEMBER_LINK_STATE_CONFLICT,
            MEMBER_LINK_VERSION_CONFLICT, MEMBER_LINK_EVIDENCE_EXPIRED,
            MEMBER_LINK_DECISION_MISMATCH, MEMBER_LINK_SELF_REVIEW_FORBIDDEN,
            MEMBER_LINK_LEAD_CONFLICT, MEMBER_LINK_EXPIRED,
            MEMBER_APP_ACCESS_BLOCKED and MEMBER_RELATIONSHIP_CLOSED.
        message:
          type: string
        errors:
          type: object
          additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    ErrorEnvelope:
      $ref: "#/components/schemas/ErrorPayload"
    PaginationMeta:
      type: object
      required: [page, perPage, total, lastPage]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        lastPage: { type: integer, minimum: 1 }
    Pagination:
      $ref: "#/components/schemas/PaginationMeta"
    HealthEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [service, status]
          properties:
            service:
              type: string
            status:
              type: string
              enum: [ok]
        requestId:
          $ref: "#/components/schemas/RequestId"
    WechatLoginRequest:
      type: object
      required: [appType, code]
      properties:
        appType:
          type: string
          enum: [member, staff]
        code:
          type: string
          minLength: 1
          maxLength: 128
        deviceName:
          type: string
          nullable: true
          maxLength: 120
        tenantId:
          type: integer
          minimum: 1
          description: Required only when one account has multiple active staff contexts
    Account:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    StaffContext:
      type: object
      required: [id, name, tenantId, sites, permissions]
      properties:
        id:
          type: integer
        name:
          type: string
        tenantId:
          type: integer
        sites:
          type: array
          items:
            $ref: "#/components/schemas/StaffSiteContext"
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    StaffSiteContext:
      allOf:
        - $ref: "#/components/schemas/SiteReference"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              uniqueItems: true
              items: { type: string }
    LoginEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [accessToken, tokenType, expiresAt, registrationRequired, account]
          properties:
            accessToken:
              type: string
            tokenType:
              type: string
              enum: [Bearer]
            expiresAt:
              type: string
              format: date-time
            registrationRequired:
              type: boolean
            account:
              $ref: "#/components/schemas/Account"
            staff:
              allOf:
                - $ref: "#/components/schemas/StaffContext"
              nullable: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    LogoutEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [loggedOut]
          properties:
            loggedOut:
              type: boolean
        requestId:
          $ref: "#/components/schemas/RequestId"
    MeEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [account, staffProfiles]
          properties:
            account:
              $ref: "#/components/schemas/Account"
            staffProfiles:
              type: array
              items:
                $ref: "#/components/schemas/StaffContext"
        requestId:
          $ref: "#/components/schemas/RequestId"
    SiteReference:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: "#/components/schemas/SiteStatus"
    SiteStatus:
      type: string
      enum: [preparing, active, suspended, disabled]
    Site:
      allOf:
        - $ref: "#/components/schemas/SiteReference"
        - type: object
          required: [code, timezone, version]
          properties:
            code:
              type: string
            phone:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            longitude:
              type: number
              nullable: true
            latitude:
              type: number
              nullable: true
            timezone:
              type: string
            version:
              type: integer
              minimum: 1
    SiteWritableFields:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 40
          pattern: "^[A-Za-z0-9_-]+$"
