components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SiteId:
      name: site
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ChainSiteIds:
      name: siteIds
      in: query
      required: false
      description: Comma-separated site ids for chain rollup; defaults to staff-assigned sites when omitted
      schema:
        type: string
        example: "1,2,3"
    MemberId:
      name: member
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MemberLinkRequestId:
      name: linkRequest
