openapi: 3.0.3
info:
  title: Mijing Next API
  version: 0.2.0
servers:
  - url: http://127.0.0.1:8010/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /admin/auth/login:
    post:
      operationId: loginSuperAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuperAdminLoginRequest" }
      responses:
        "200":
          description: Super administrator authenticated with an independent admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminLoginEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/auth/logout:
    post:
      operationId: logoutSuperAdmin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current super administrator token revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/me:
    get:
      operationId: getSuperAdminProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current platform super administrator profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminProfileEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cross-tenant platform dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/tenants:
    get:
      operationId: listAdminTenants
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, maxLength: 24 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Cross-tenant tenant directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTenantListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/members:
    get:
      operationId: listAdminMembers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CrmMemberStatus" } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Cross-tenant member directory with masked mobile numbers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMemberListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/resources/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
          enum: [staff, courses, schedules, appointments, cards, orders]
    get:
      operationId: listAdminResourceData
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: query, schema: { type: integer, minimum: 1, nullable: true } }
        - { name: siteId, in: query, schema: { type: integer, minimum: 1, nullable: true } }
        - { name: query, in: query, schema: { type: string, maxLength: 120, nullable: true } }
        - { name: status, in: query, schema: { type: string, maxLength: 32, nullable: true } }
        - { name: from, in: query, schema: { type: string, format: date, nullable: true } }
        - { name: to, in: query, schema: { type: string, format: date, nullable: true } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Server-filtered, cross-tenant read-only rows for the selected platform resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourceListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/settings/payments/wechat:
    get:
      operationId: getAdminWechatPaymentConfig
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Safe WeChat payment configuration without secret values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWechatPaymentConfigEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateAdminWechatPaymentConfig
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminWechatPaymentConfigRequest" }
      responses:
        "200":
          description: WeChat payment configuration updated using optimistic locking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWechatPaymentConfigEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/media-assets:
    get:
      operationId: listAdminMediaAssets
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: kind, in: query, schema: { type: string, enum: [image, video] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
        - { name: tenantId, in: query, schema: { type: integer, minimum: 1, nullable: true } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Platform-managed image and video resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMediaAssetListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminMediaAsset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateAdminMediaAssetRequest" }
      responses:
        "201":
          description: Draft media asset uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMediaAssetEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/media-assets/{mediaAsset}:
    parameters:
      - name: mediaAsset
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      operationId: updateAdminMediaAsset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminMediaAssetRequest" }
      responses:
        "200":
          description: Media asset metadata updated with optimistic locking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMediaAssetEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/media-assets/{mediaAsset}/publish:
    parameters:
      - name: mediaAsset
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: publishAdminMediaAsset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVersionRequest" }
      responses:
        "200":
          description: Media asset published for public consumption
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMediaAssetEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/media-assets/{mediaAsset}/archive:
    parameters:
      - name: mediaAsset
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: archiveAdminMediaAsset
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVersionRequest" }
      responses:
        "200":
          description: Media asset archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMediaAssetEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/media-assets/{mediaAsset}/content:
    parameters:
      - name: mediaAsset
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getAdminMediaAssetContent
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Private inline media bytes for an authenticated super administrator
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /media/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPublishedMediaAsset
      responses:
        "200":
          description: Public immutable bytes for a published media asset
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/queues/overview:
    get:
      operationId: getAdminQueueOverview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cross-queue platform workload overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQueueOverviewEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/queues/jobs:
    get:
      operationId: listAdminQueueJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: queue, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [ready, reserved, delayed] } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Pending, reserved and delayed queue jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminQueueJobListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/queues/failed:
    get:
      operationId: listAdminFailedJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: queue, in: query, schema: { type: string, maxLength: 120 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Failed queue jobs across tenants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFailedJobListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/queues/batches:
    get:
      operationId: listAdminJobBatches
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Queue job batches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJobBatchListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/queues/failed/{uuid}/retry:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryAdminFailedJob
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Failed job returned to its queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFailedJobActionEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/queues/failed/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: forgetAdminFailedJob
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Failed job permanently forgotten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFailedJobActionEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: method, in: query, schema: { type: string, enum: [POST, PUT, PATCH, DELETE] } }
        - { name: status, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Safe metadata for sensitive super administrator write operations; request bodies, secrets, queue payloads and full exceptions are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLogListEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/wechat/login:
    post:
      operationId: loginWithWechat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginRequest"
      responses:
        "200":
          description: Authenticated in the requested client context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: logoutCurrentSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getCurrentAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account and staff context authorized for this client session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sites:
    get:
      operationId: listSites
      x-required-client: staff
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sites assigned to the token staff context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSite
      x-required-client: staff
      x-required-permission: organization.site.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "202":
          description: A verified-mobile candidate requires explicit member confirmation and staff review before joining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberLinkReviewEnvelope"
        "201":
          description: Site created and assigned to the current staff context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /member/onboarding:
    get:
      operationId: getMemberOnboarding
      x-required-client: member
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server-derived member registration state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOnboardingEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /member/profile:
    get:
      operationId: getMemberTenantProfile
      x-required-client: member
      x-capability: member.profile.read
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Tenant-scoped member profile with field policy and registration state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberTenantProfileEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      operationId: updateOwnMemberProfile
      x-required-client: member
      x-capability: member.onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberProfileRequest"
      responses:
        "200":
          description: Onboarding profile and consent saved (no tenantId query param)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOnboardingEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: patchMemberTenantProfile
      x-required-client: member
      x-capability: member.profile.update
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberTenantProfileRequest" }
      responses:
        "200":
          description: Self-service profile patch honoring tenant field policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberTenantProfileEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /member/profile/ranking-opt-in:
    patch:
      operationId: updateMemberRankingOptIn
      x-required-client: member
      x-capability: member.profile.ranking-opt-in
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optIn]
              properties:
                optIn: { type: boolean }
      responses:
        "200":
          description: Member monthly ranking opt-in preference updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRankingOptInEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /member/profile/purchase-gate:
    get:
      operationId: getMemberPurchaseGate
      x-required-client: member
      x-capability: member.profile.purchase-gate
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Pre-purchase profile completeness check with redirect hints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPurchaseGateEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /member/profile/avatar:
    post:
      operationId: uploadMemberAvatar
      x-required-client: member
      x-capability: member.avatar
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Avatar stored and profile object key updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberAvatarUploadEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /member/profile/verify-mobile:
    post:
      operationId: verifyOwnWechatMobile
      x-required-client: member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Verified mobile stored encrypted and returned masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOnboardingEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /member/sites:
    get:
      operationId: listJoinableMemberSites
      x-required-client: member
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sites available for explicit membership joining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSiteListEnvelope"
  /member/memberships:
    post:
      operationId: joinMemberSite
      x-required-client: member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId]
              properties:
                siteId:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Tenant membership, CRM projection and site relation created or restored idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberMembershipEnvelope"
        "202":
          description: A verified-mobile candidate requires explicit member and staff review before membership is created or linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberLinkReviewEnvelope"
        "403":
