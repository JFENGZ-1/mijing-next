          $ref: "#/components/schemas/SiteStatus"
        phone:
          type: string
          nullable: true
          maxLength: 32
        address:
          type: string
          nullable: true
          maxLength: 255
        longitude:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        timezone:
          type: string
